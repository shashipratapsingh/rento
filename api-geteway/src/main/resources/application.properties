spring.application.name=api-geteway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
#acuator

management.endpoints.web.exposure.include=*
spring.datasource.url=jdbc:mysql://localhost:3306/BhikhariAPP?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Route to Auth Service
spring.cloud.gateway.server.webmvc.routes[0].id=bhikhari-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://BHIKHARI
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/**

spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

#security
jwt.secret=MyVerySecretKeyForBankingApplication
