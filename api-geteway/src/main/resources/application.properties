spring.application.name=api-geteway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
#acuator

management.endpoints.web.exposure.include=*
spring.datasource.url=jdbc:mysql://localhost:3306/BhikhariAPP?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Route to Auth Service
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

# Owner Service
spring.cloud.gateway.server.webmvc.routes[1].id=owner-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://OWNER-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/owners/**

spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-methods=*
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-headers=*

#security
jwt.secret=MyVerySecretKeyForBankingApplication
