spring.application.name=owner-service
server.port=9083
#db configuration
spring.datasource.url=jdbc:mysql://localhost:3306/rento?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# update ,Create ,create-update ,validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# security
jwt.secret=MyVerySecretKeyForBankingApplication

#microserivce

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# =========================
# FILE UPLOAD
# =========================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# =========================
# FILE LOCATION
# =========================

app.upload.dir=uploads/rooms